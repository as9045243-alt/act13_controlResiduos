<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifiesto RPBI Ecológico</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container">
        <!-- Título principal -->
        <h2 class="text-success border-bottom pb-2 mb-4">☣️ Control de Residuos Biológico Infecciosos</h2>

        <!-- Tarjetas de resumen -->
        <div class="row mb-4 text-center">
            <div class="col-md-6 mb-3 mb-md-0">
                <div class="p-3 bg-danger text-white rounded shadow-sm">
                    Total Punzocortantes: <span id="totPunzo" class="fs-4 fw-bold">0</span> kg
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 bg-warning text-dark rounded shadow-sm">
                    Total Patológicos: <span id="totPato" class="fs-4 fw-bold">0</span> kg
                </div>
            </div>
        </div>

        <!-- Formulario y Listado -->
        <div class="row">
            <!-- Formulario de Registro -->
            <div class="col-md-4 mb-4">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title text-secondary mb-3">Registrar Desecho</h5>
                    <div class="mb-3">
                        <label for="areaHosp" class="form-label text-muted small">Área del Hospital</label>
                        <input type="text" id="areaHosp" class="form-control" placeholder="Ej. Quirófano 1">
                    </div>
                    <div class="mb-3">
                        <label for="tipoRPBI" class="form-label text-muted small">Clasificación</label>
                        <select id="tipoRPBI" class="form-select">
                            <option value="punzocortante">Punzocortante (Rojo)</option>
                            <option value="patologico">Patológico (Amarillo)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="pesoKg" class="form-label text-muted small">Peso (Kg)</label>
                        <input type="number" step="0.1" id="pesoKg" class="form-control" placeholder="0.0">
                    </div>
                    <button id="btnAgregarResiduo" class="btn btn-success w-100">Registrar Bolsa/Recipiente</button>
                </div>
            </div>

            <!-- Listado de Residuos -->
            <div class="col-md-8">
                <h5 class="text-secondary mb-3">Historial de Registros</h5>
                <ul id="listaResiduos" class="list-group shadow-sm">
                    <!-- Los elementos se inyectarán dinámicamente con JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Script de la aplicación conectado correctamente -->
    <script src="../js/logic.js"></script>
</body>
</html>
